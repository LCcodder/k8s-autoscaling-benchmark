apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniurl-api
  namespace: miniurl
  labels:
    app: miniurl-api
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: miniurl-api
  template:
    metadata:
      labels:
        app: miniurl-api
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: wait-for-deps
            image: busybox:1.36
            envFrom:
            - configMapRef:
                name: app-config
            command: ["sh", "-c"]
            args:
            - |
                until nc -z "$REDIS_HOST" "$REDIS_PORT"; do echo "waiting for redis"; sleep 3; done
                until nc -z "$CASSANDRA_HOST" "$CASSANDRA_PORT"; do echo "waiting for cassandra"; sleep 3; done
      containers:
        - name: miniurl-api
          image: "{{ .Values.image.repository }}:{{ required "укажи --set image.tag" .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_USERNAME
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20