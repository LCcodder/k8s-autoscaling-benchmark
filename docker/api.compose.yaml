name: api-infra

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_IP:-0.0.0.0}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  cassandra:
    image: cassandra:4.1
    command:
      - bash
      - -c
      - |
        sed -i 's/^authenticator:.*/authenticator: PasswordAuthenticator/' /etc/cassandra/cassandra.yaml
        exec docker-entrypoint.sh cassandra -f
    environment:
      CASSANDRA_CLUSTER_NAME: bench
      # адрес, который драйвер получит от ноды и по которому пойдёт из пода
      CASSANDRA_BROADCAST_RPC_ADDRESS: ${HOST_IP}
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    ports:
      - "${HOST_IP:-0.0.0.0}:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9042'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_ADMIN_PASSWORD: ${CASSANDRA_ADMIN_PASSWORD}
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
      - ./cassandra/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

volumes:
  redis-data:
    name: redis-data
    driver: local
  cassandra-data:
    name: cassandra-data
    driver: local